<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#05080D"/><stop offset=".55" stop-color="#090D14"/><stop offset="1" stop-color="#070B12"/></linearGradient>
  <linearGradient id="signal" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#58A6FF" stop-opacity=".08"/><stop offset=".31" stop-color="#58A6FF"/><stop offset=".67" stop-color="#A371F7"/><stop offset="1" stop-color="#39D98A" stop-opacity=".75"/></linearGradient>
  <linearGradient id="name" x1="68" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F4F7FB"/><stop offset=".68" stop-color="#DCE5EF"/><stop offset="1" stop-color="#7D8998"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#58A6FF" stop-opacity=".17"/><stop offset=".46" stop-color="#A371F7" stop-opacity=".07"/><stop offset="1" stop-color="#060A10" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#30363D" stroke-opacity=".11"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="panel"><rect width="1200" height="430" rx="24"/></clipPath>
  <style>
    .flow{stroke-dasharray:170 1050;animation:flow 6.8s linear infinite}.pulse{animation:pulse 2.6s ease-in-out infinite}.orbit{transform-origin:985px 225px;animation:orbit 18s linear infinite}.scan{animation:scan 8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-1220}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(520px)}}
    @media (prefers-reduced-motion:reduce){.flow,.pulse,.orbit,.scan{animation:none}}
  </style>
</defs>
<g clip-path="url(#panel)">
  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#grid)"/>
  <circle cx="985" cy="225" r="286" fill="url(#halo)"/>
  <rect class="scan" x="0" y="-90" width="1200" height="90" fill="url(#halo)" opacity=".18"/>
</g>
