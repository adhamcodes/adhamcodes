  <circle cx="840" cy="188" r="4" fill="#A371F7"/>
  <text x="856" y="193" fill="#C9D1D9" font-size="12">AI / ML DIRECTION</text>
  <circle cx="840" cy="221" r="4" fill="#3FB950"/>
  <text x="856" y="226" fill="#C9D1D9" font-size="12">BUILDING SYSTEMS</text>
</g>

<text x="73" y="391" fill="#484F58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.4">UNDERSTAND / BUILD / BREAK / DEBUG / PROVE / SHIP</text>
<rect x="-260" y="407" width="260" height="2" fill="url(#scan)">
