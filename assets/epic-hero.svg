<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070A0F"/>
    <stop offset=".52" stop-color="#0A0E15"/>
    <stop offset="1" stop-color="#090D13"/>
  </linearGradient>
  <linearGradient id="signal" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#58A6FF" stop-opacity=".15"/>
    <stop offset=".34" stop-color="#58A6FF"/>
    <stop offset=".66" stop-color="#A371F7"/>
    <stop offset="1" stop-color="#3FB950" stop-opacity=".7"/>
  </linearGradient>
  <linearGradient id="name" x1="74" y1="0" x2="790" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F0F6FC"/>
    <stop offset=".72" stop-color="#DDE6F0"/>
    <stop offset="1" stop-color="#8B949E"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#58A6FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#58A6FF" stop-opacity=".75"/>
    <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" stroke="#30363D" stroke-opacity=".16" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="419" rx="23.5" stroke="#30363D"/>
<rect x="1" y="1" width="1198" height="418" rx="23" fill="url(#grid)" opacity=".5"/>
<path d="M0 49H1200" stroke="#21262D"/>

<circle cx="27" cy="24" r="4.5" fill="#FF7B72"/>
<circle cx="45" cy="24" r="4.5" fill="#D29922"/>
<circle cx="63" cy="24" r="4.5" fill="#3FB950"/>
<text x="84" y="29" fill="#6E7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.3">ADHAM / PROFILE.SYS</text>
<text x="1116" y="29" text-anchor="end" fill="#6E7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.2">SIGNAL ONLINE</text>
<circle cx="1135" cy="24" r="4.5" fill="#3FB950"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>

<text x="72" y="100" fill="#6E7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.5">IDENTITY / BUILDING IN PUBLIC</text>
<text x="70" y="171" fill="url(#name)" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="900" letter-spacing="-3">ADHAM</text>
<text x="70" y="238" fill="#0A0E15" stroke="#6E7681" stroke-width="1.6" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="900" letter-spacing="-3">MAHMOOD</text>
<text x="73" y="279" fill="#58A6FF" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="600">software → systems → intelligence</text>

<path d="M72 323 C185 323 211 297 304 297 C393 297 421 350 506 350 C595 350 630 307 711 307 C784 307 814 327 886 327 C959 327 989 296 1122 296" stroke="#21262D" stroke-width="8" stroke-linecap="round" opacity=".72"/>
<path d="M72 323 C185 323 211 297 304 297 C393 297 421 350 506 350 C595 350 630 307 711 307 C784 307 814 327 886 327 C959 327 989 296 1122 296" stroke="url(#signal)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="260 900" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="0;-1160" dur="5.8s" repeatCount="indefinite"/>
</path>
<circle r="5.5" fill="#F0F6FC" filter="url(#glow)">
  <animateMotion dur="5.8s" repeatCount="indefinite" path="M72 323 C185 323 211 297 304 297 C393 297 421 350 506 350 C595 350 630 307 711 307 C784 307 814 327 886 327 C959 327 989 296 1122 296"/>
</circle>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="812" y="86" width="310" height="156" rx="16" fill="#0D1117" fill-opacity=".76" stroke="#30363D"/>
